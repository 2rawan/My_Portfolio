    <text x="44" y="700" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#fff">Next stop: Museum of Art</text>
    <text x="44" y="732" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="700" fill="#6EE7B7">Arriving in 3 min</text>
