      <text x="94" y="321" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#0B2D5B">Text size</text>
      <text x="350" y="321" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="end">Large</text>
      <text x="46" y="376" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#5B6B82">A</text>
      <rect x="70" y="368" width="252" height="6" rx="3" fill="#E5EAF0"/>
      <rect x="70" y="368" width="189" height="6" rx="3" fill="#2563EB"/>
      <circle cx="259" cy="371" r="12" fill="#fff" stroke="#2563EB" stroke-width="3"/>
      <text x="344" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="26" font-weight="700" fill="#0B2D5B" text-anchor="middle">A</text>
