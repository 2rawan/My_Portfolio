      <text x="94" y="571" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#0B2D5B">Voice announcements</text>
      <text x="94" y="590" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="400" fill="#5B6B82">Speak next stop and arrivals</text>
