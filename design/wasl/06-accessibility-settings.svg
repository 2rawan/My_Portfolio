        <circle cx="12" cy="12" r="3"/>
      </g>
      <text x="94" y="251" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#0B2D5B">High contrast</text>
      <text x="94" y="270" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="400" fill="#5B6B82">Stronger colours and borders</text>
      <g id="Toggle">
