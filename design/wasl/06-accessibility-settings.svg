        <text x="306" y="505" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#0B2D5B" text-anchor="middle">+5</text>
        <circle cx="338" cy="500" r="12" fill="#2563EB"/>
        <g transform="translate(332 494) scale(0.5)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </g>
      </g>
    </g>
    <rect x="94" y="535" width="256" height="1" rx="0" fill="#E5EAF0"/>
    <g id="Setting / Voice announcements">
      <circle cx="61" cy="572" r="21" fill="#E8F0FE"/>
      <g transform="translate(50 561) scale(0.916667)" fill="none" stroke="#2563EB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>
