      <rect x="299" y="22" width="3" height="6" rx="1" fill="#fff"/>
      <rect x="304" y="19" width="3" height="9" rx="1" fill="#fff"/>
      <rect x="309" y="16" width="3" height="12" rx="1" fill="#fff"/>
      <rect x="314" y="13" width="3" height="15" rx="1" fill="#fff"/>
    </g>
    <g fill="none" stroke="#0B2D5B" stroke-width="2" stroke-linecap="round">
      <path d="M324 19a8 8 0 0 1 11 0M326.5 22a5 5 0 0 1 6 0"/>
    </g>
    <circle cx="329.5" cy="25.5" r="1.5" fill="#0B2D5B"/>
    <rect x="341" y="14" width="25" height="13" rx="4" fill="none" stroke="#0B2D5B" stroke-width="1" opacity="0.5"/>
    <rect x="343" y="16" width="18" height="9" rx="2.5" fill="#0B2D5B"/>
    <rect x="367" y="18" width="2" height="5" rx="1" fill="#0B2D5B" opacity="0.5"/>
