        <path d="M12 7v5l3 2"/>
      </g>
      <text x="94" y="499" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#0B2D5B">Extra transfer time</text>
      <text x="94" y="518" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="400" fill="#5B6B82">Currently +5 min</text>
