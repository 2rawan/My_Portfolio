        <circle cx="272" cy="500" r="12" fill="#fff" stroke="#2563EB" stroke-width="2"/>
        <g transform="translate(266 494) scale(0.5)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
