<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <title>WASL — Accessibility Settings</title>
  <rect id="Background" x="0" y="0" width="390" height="844" rx="0" fill="#F5F7FB"/>
  <g id="Header">
    <circle cx="44" cy="76" r="20" fill="#fff" stroke="#E5EAF0" stroke-width="1"/>
    <g transform="translate(34 66) scale(0.833333)" fill="none" stroke="#0B2D5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </g>
    <text x="195" y="82" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#0B2D5B" text-anchor="middle">Accessibility</text>
  </g>
  <text x="24" y="128" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#5B6B82">Make WASL work the way you do.</text>
  <g id="Settings list">
    <g>
      <rect x="24" y="146" width="342" height="472" rx="20" fill="#0B2D5B" opacity="0.05"/>
      <rect x="24" y="144" width="342" height="472" rx="20" fill="#fff" stroke="#E5EAF0" stroke-width="1"/>
    </g>
    <g id="Setting / Step-free routes">
      <circle cx="61" cy="180" r="21" fill="#E8F0FE"/>
      <g transform="translate(50 169) scale(0.916667)" fill="none" stroke="#2563EB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="4" r="1.6"/>
        <path d="M10 7.5v6h5l3 5M10 10h5M7 12a5.5 5.5 0 1 0 7.5 7"/>
      </g>
      <text x="94" y="179" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#0B2D5B">Step-free routes</text>
      <text x="94" y="198" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="400" fill="#5B6B82">Avoid stairs and steep ramps</text>
      <g id="Toggle">
        <rect x="298" y="164" width="52" height="32" rx="16" fill="#2563EB"/>
        <circle cx="336" cy="180" r="12" fill="#fff"/>
