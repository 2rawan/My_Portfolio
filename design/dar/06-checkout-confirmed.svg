    <text x="195" y="352" font-family="Playfair Display, serif" font-size="32" font-weight="600" fill="#2B2119" text-anchor="middle">on its way</text>
    <rect x="110" y="372" width="170" height="32" rx="16" fill="#FFFFFF" stroke="#E6DED3" stroke-width="1"/>
    <text x="195" y="393" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4E3B2A" text-anchor="middle">Order #DAR-20418</text>
  </g>
  <g id="Delivery card">
