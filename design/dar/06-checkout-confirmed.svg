    <text x="98" y="470" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#8A7F74" text-anchor="start">Estimated delivery</text>
    <text x="98" y="494" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2B2119" text-anchor="start">Tue 18 – Thu 20 Nov</text>
