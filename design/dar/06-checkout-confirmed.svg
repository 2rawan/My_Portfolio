    <g id="Signal"><rect x="296" y="27" width="3" height="5" rx="1" fill="#2B2119"/><rect x="301" y="25" width="3" height="7" rx="1" fill="#2B2119"/><rect x="306" y="22" width="3" height="10" rx="1" fill="#2B2119"/><rect x="311" y="19" width="3" height="13" rx="1" fill="#2B2119"/></g>
    <path id="Wifi" d="M319 24.5a8 8 0 0 1 11 0M321.2 27.2a5 5 0 0 1 6.6 0M323.3 29.8a2 2 0 0 1 2.4 0" fill="none" stroke="#2B2119" stroke-width="1.7" stroke-linecap="round"/>
    <g id="Battery"><rect x="337" y="19" width="22" height="12" rx="3.5" fill="none" stroke="#2B2119" stroke-opacity="0.4"/><rect x="339" y="21" width="16" height="8" rx="2" fill="#2B2119"/><rect x="360.5" y="23" width="1.5" height="4" rx="0.7" fill="#2B2119" opacity="0.4"/></g>
