  <g id="Eco impact card">
    <rect x="24" y="532" width="342" height="92" rx="20" fill="#EEF0E4"/>
    <circle cx="64" cy="578" r="22" fill="#FFFFFF"/>
    <g id="Icon / leaf" transform="translate(52 566) scale(1)" fill="none" stroke="#6E7055" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></g>
    <text x="98" y="568" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#6E7055" text-anchor="start">Eco impact</text>
    <text x="98" y="592" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2B2119" text-anchor="start">This order planted 2 trees</text>
    <text x="98" y="610" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5C5148" text-anchor="start">Carbon-neutral delivery included</text>
