    <g id="Icon / leaf" transform="translate(96 120) scale(1.08333)" fill="none" stroke="#6E7055" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></g>
    <g id="Icon / leaf" transform="translate(268 240) scale(1.08333)" fill="none" stroke="#4E3B2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></g>
    <circle cx="110" cy="232" r="5" fill="#C9A24A"/>
    <circle cx="286" cy="130" r="6" fill="#D9CBB8"/>
    <circle cx="300" cy="178" r="3.5" fill="#6E7055"/>
    <circle cx="86" cy="178" r="3.5" fill="#C9A24A"/>
  </g>
  <g id="Title">
